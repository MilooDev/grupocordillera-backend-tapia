services:
  # --- INFRAESTRUCTURA (BASES DE DATOS Y MENSAJERÍA) ---
  
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-cordillera
    environment:
      POSTGRES_USER: cordillera_admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cordillera_db
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-cordillera
    ports:
      - "5672:5672"   # Puerto de datos
      - "15672:15672" # Panel de control (Usuario: guest / Pass: guest)

  redis:
    image: redis:alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"

  # --- MICROSERVICIOS CORE (LÓGICA DE NEGOCIO) ---

  eureka-server:
    build: ./backend-cordillera/eureka_server
    container_name: eureka-server
    ports:
      - "8761:8761"

  gc-auth:
    build: ./backend-cordillera/gc_auth
    container_name: gc-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  gc-inventario-compras:
    build: ./backend-cordillera/gc_inventario_compras
    container_name: gc-inventario-compras
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  gc-ventas:
    build: ./backend-cordillera/gc_ventas
    container_name: gc-ventas
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - rabbitmq
      - eureka-server

  gc-reportes-pdf:
    build: ./backend-cordillera/gc_reportes_pdf
    container_name: gc-reportes-pdf
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  # --- PUERTA DE ENTRADA (GATEWAY) ---

  api-gateway:
    build: ./backend-cordillera/api_gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - redis
      - eureka-server