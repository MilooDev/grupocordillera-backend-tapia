server:
  port: 8081

spring:
  application:
    name: GC-AUTH
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cordillera_db}
    username: ${DB_USERNAME:cordillera_admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jmx:
    enabled: false


eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8769/eureka/}

# 👇 LA MAGIA PARA ALINEAR SWAGGER CON EL GATEWAY 👇
springdoc:
  api-docs:
    path: /api/auth/v3/api-docs