server:
  port: 8081

spring:
  application:
    name: GC-AUTH
  datasource:
    url: jdbc:postgresql://localhost:5432/cordillera_db
    username: cordillera_admin
    password: admin123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8769/eureka/