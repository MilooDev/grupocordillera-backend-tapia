server:
  port: 8082

spring:
  application:
    name: GC-VENTAS
  # 👇 AQUÍ ESTÁ LA SOLUCIÓN AL CHOQUE DE TRENES DE RABBITMQ
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cordillera_db}
    username: ${DB_USERNAME:cordillera_admin}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

# 👇 LA RUTA PARA CONECTAR SWAGGER AL GATEWAY
springdoc:
  api-docs:
    path: /ventas/v3/api-docs