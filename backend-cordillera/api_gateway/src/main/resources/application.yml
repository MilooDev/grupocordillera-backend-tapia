server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # =========================================================
      # CONFIGURACIÓN GLOBAL DE CORS PARA EL FRONTEND
      # =========================================================
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            
      routes:
        # =========================================================
        # RUTAS DE DOCUMENTACIÓN SWAGGER (Bypass de Filtros)
        # =========================================================
        - id: swagger-ventas
          uri: lb://GC-VENTAS
          predicates:
            - Path=/ventas/v3/api-docs
            
        - id: swagger-inventario
          uri: lb://GC-INVENTARIO-COMPRAS
          predicates:
            - Path=/api/inventario/v3/api-docs
            
        - id: swagger-reportes
          uri: lb://GC-REPORTES-PDF
          predicates:
            - Path=/api/reportes/v3/api-docs
            
        - id: swagger-admin-auth
          uri: lb://GC-AUTH
          predicates:
            - Path=/api/auth/v3/api-docs

        # =========================================================
        # RUTAS DE NEGOCIO CORE
        # =========================================================
        - id: auth-service
          uri: lb://GC-AUTH
          predicates:
            - Path=/api/auth/**

        - id: auth-admin-service
          uri: lb://GC-AUTH
          predicates:
            - Path=/api/admin/**
          filters:
            - AuthenticationFilter

        - id: ventas-service
          uri: lb://GC-VENTAS
          predicates:
            - Path=/ventas/**
          filters:
            - AuthenticationFilter

        - id: inventario-service
          uri: lb://GC-INVENTARIO-COMPRAS
          predicates:
            - Path=/api/inventario/**
          filters:
            - AuthenticationFilter

        - id: reportes-service
          uri: lb://GC-REPORTES-PDF
          predicates:
            - Path=/api/reportes/**
          filters:
            - AuthenticationFilter
  jmx:
    enabled: false


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

# =========================================================
# MENÚ DESPLEGABLE DE SWAGGER CENTRALIZADO
# =========================================================
springdoc:
  swagger-ui:
    urls:
      - name: 🔐 Módulo de Autenticación
        url: /api/auth/v3/api-docs
      - name: 🛒 Módulo de Ventas
        url: /ventas/v3/api-docs
      - name: 📦 Módulo de Inventario
        url: /api/inventario/v3/api-docs