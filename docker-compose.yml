version: '3.8'

services:
  # --- INFRAESTRUCTURA ---
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-cordillera
    environment:
      POSTGRES_USER: cordillera_admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cordillera_db
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-cordillera
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: redis-gateway
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:latest
    container_name: mongodb-cordillera
    ports:
      - "27017:27017"

  # --- MICROSERVICIOS CORE (JAVA / SPRING BOOT) ---

  eureka-server:
    build: ./eureka_server
    container_name: eureka-server
    ports:
      - "8769:8761"

  gc-auth:
    build: ./gc_auth
    container_name: gc-auth
    ports:
      - "8091:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  gc-ventas:
    build: ./gc_ventas
    container_name: gc-ventas
    ports:
      - "8092:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - rabbitmq
      - eureka-server

  gc-inventario-compras:
    build: ./gc_inventario_compras
    container_name: gc-inventario-compras
    ports:
      - "8093:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  # --- ANALÍTICA Y REPORTES (JAVA + PYTHON) ---

  gc_reportes_pdf:
    build: ./gc_reportes_pdf
    container_name: gc_reportes_pdf
    ports:
      - "8099:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  gc_kpi_analytics:
    build: ./gc_kpi_analytics
    container_name: gc_kpi_analytics
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MONGO_URI=mongodb://mongodb:27017/kpi_db
    depends_on:
      - rabbitmq
      - mongodb

  # --- PUERTA DE ENTRADA Y BFF ---

  api-gateway:
    build: ./api_gateway
    container_name: api-gateway
    ports:
      - "8090:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - redis
      - eureka-server

  gc_bff_reportes:
    build: ./gc_bff_reportes
    container_name: gc_bff_reportes
    ports:
      - "8095:8095"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/cordillera_db
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - postgres-db
      - eureka-server

  # --- HERRAMIENTAS DE DESARROLLO ---
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube-cordillera
    ports:
      - "9000:9000"
    environment:
      - SONAR_FORCEAUTHENTICATION=false