services:
  postgres-db:
    image: postgres:15
    container_name: cordillera-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cordillera_db
      POSTGRES_USER: cordillera_admin
      POSTGRES_PASSWORD: admin123

  eureka-server:
    build: ./eureka_server
    ports:
      - "8761:8761"

  gc-auth:
    build: ./gc_auth
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cordillera_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

  api-gateway:
    build: ./api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

  gc-ventas:
    build: ./gc_ventas
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cordillera_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

  gc-inventario-compras:
    build: ./gc_inventario_compras
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cordillera_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

  gc-finanzas:
    build: ./gc_finanzas
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/cordillera_db
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/

gc-bff-reportes:
    build: ./gc_bff_reportes/gc_bff_reportes
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - redis-cache
    environment:
      REDIS_HOST: redis-cache
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/